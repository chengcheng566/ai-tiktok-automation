name: Daily AI Content Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI content with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p output

          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d '{
              "model": "llama-3.3-70b-versatile",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a professional short-form content creator. Create interesting, factual, entertaining content for a global TikTok audience. Use simple English that international viewers can understand. Include a Burmese translation so Myanmar viewers can also understand it. Avoid politics, harmful misinformation, medical claims, and copyrighted text."
                },
                {
                  "role": "user",
                  "content": "Create one original TikTok content idea for today. Return exactly these sections: TITLE, HOOK, SCRIPT_ENGLISH, SCRIPT_BURMESE, CAPTION, HASHTAGS. Topic can be Interesting Facts, Psychology, Technology, AI, Space, Animals, History, Life Tips, or Amazing Facts. Make it suitable for a 30-second vertical video."
                }
              ],
              "temperature": 0.8,
              "max_tokens": 800
            }')

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > output/daily-content.txt

          echo "" >> output/daily-content.txt
          echo "Generated UTC: $(date -u)" >> output/daily-content.txt

          if grep -q "^null$" output/daily-content.txt; then
            echo "Groq generation failed."
            echo "$RESPONSE"
            exit 1
          fi

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/daily-content.txt
          git commit -m "Generate daily AI content" || echo "No changes to commit"
          git push
